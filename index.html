<meta name="mobile-web-app-capable" content="yes">

<style>
/* NION medical theme: pale sky background with drifting dots and a DNA strand, dark rounded cards, teal icons, coral actions. */
:root{
  --sky1:#eef3f8; --sky2:#c6d8ea; --sky3:#93b3d2; --ink:#3a4856;
  --card:#f2f6fa; --card2:#1f3346; --field:#ffffff; --line:rgba(255,255,255,.75);
  --text:#1b3044; --sub:#5d6c79;
  --teal:#2f7480; --teal2:#1c4c58; --teal-txt:#2a6e74;
  --coral:#c9472f; --salmon:#b53a2a;
  --low:#3fb57a; --mid:#e8b33a; --high:#ec7a3c; --top:#e04454;
  --bgmid:#dfe9f3; --hero:rgba(242,246,250,.86); --fline:rgba(30,60,90,.14); --arrow:#5d6c79; --ph:#8b98a3;
  --chipbg:rgba(47,116,128,.12); --none:#8a97a2; --fine:#7b8894; --meter:rgba(30,60,90,.1); --b2line:rgba(30,60,90,.2);
  --shadow:rgba(40,60,90,.14); --logoglow:rgba(60,90,130,.35);
  --font:"Montserrat", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-mode="dark"]{
  --sky1:#0c2547; --sky2:#071830; --sky3:#030b18; --bgmid:#0a1f3b; --ink:#cfe0f2;
  --card:rgba(18,38,66,.92); --card2:#e8f2ff; --field:#0e1f36; --line:rgba(120,180,255,.14);
  --text:#e8f2ff; --sub:#9fb3c8; --teal:#2f8fa0; --teal2:#1b5f70; --teal-txt:#7fd6e0;
  --coral:#ff5a4a; --salmon:#ff8a78;
  --hero:rgba(18,38,66,.88); --fline:rgba(120,180,255,.2); --arrow:#9fb3c8; --ph:#6f849a;
  --chipbg:rgba(80,200,220,.15); --none:#7d91a6; --fine:#8396ab; --meter:rgba(255,255,255,.1); --b2line:rgba(160,200,255,.3);
  --shadow:rgba(0,0,0,.35); --logoglow:rgba(120,200,255,.5);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--sky2)}
body{margin:0;min-height:100vh;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--text);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--bgmid) 35%,var(--sky2) 70%,var(--sky3) 100%) fixed}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding-block:10px 48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--salmon);outline-offset:2px}

/* Top bar + logo */
.bar .pill{background:transparent;box-shadow:none;color:var(--ink);font-weight:700;padding:8px 10px}
.bar .pill:active{opacity:.6}
.cap{width:36px;height:36px;padding:0!important;display:grid;place-items:center}
.cap svg{width:22px;height:22px;color:var(--ink)}
.cap.spin svg{animation:spin .6s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--field);border:1px solid var(--fline);border-radius:999px;padding:3px}
.seg button{flex:1;border:none;background:none;color:var(--sub);font-weight:600;padding:9px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.bar{display:flex;justify-content:flex-end;gap:8px}
.pill{border:none;border-radius:999px;background:var(--card);color:var(--text);font-weight:600;font-size:.82rem;padding:8px 14px;box-shadow:0 4px 12px rgba(40,60,90,.18)}
.brand{text-align:center;margin-top:-4px}
.logo{position:relative;display:inline-block;font-weight:300;font-size:2.4rem;letter-spacing:.32em;margin-right:-.32em;color:#fff;
  text-shadow:0 2px 10px var(--logoglow)}

/* Cards */
.card{background:var(--card);border-radius:18px;box-shadow:0 8px 22px var(--shadow);border:1px solid var(--line)}
.hero{position:relative;z-index:2;padding:18px 16px 16px;background:var(--hero);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.top-art{position:relative;border-radius:24px;margin-bottom:-58px;z-index:1}
.figure{position:relative;height:250px}
.figure canvas{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.hero h1{margin:0;font-size:1.25rem;font-weight:700}
.hero p{margin:2px 0 12px;color:var(--sub);font-size:.85rem}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;box-sizing:border-box}
input::placeholder,textarea::placeholder{color:var(--ph)}
input,textarea,form select{border-color:var(--fline)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--arrow) 50%),linear-gradient(135deg,var(--arrow) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.groups{display:flex;flex-direction:column;gap:10px}
.grp{overflow:hidden}
.grp-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;background:none;color:var(--text);text-align:left}
.grp-head .txt,.mrow .txt{flex:1;min-width:0}
.grp-head b{display:block;font-size:.98rem;font-weight:700}
.grp-head small{display:block;color:var(--sub);font-size:.78rem}
.grp-head .badge{background:var(--chipbg);color:var(--teal-txt)}
.grp-head.zero{opacity:.6}
.chev{flex:none;width:16px;height:16px;color:var(--sub);transition:transform .2s ease}
[aria-expanded="true"] > .chev,.acc[open] > summary .chev{transform:rotate(90deg)}
.grp-body{border-top:1px solid var(--fline)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px 11px 68px;border:none;border-bottom:1px solid var(--fline);background:none;color:var(--text);text-align:left}
.mrow:last-child{border-bottom:none}
.mrow b{display:block;font-weight:600;font-size:.95rem}
.mrow small{display:block;color:var(--sub);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-empty{padding:12px 14px 14px 68px;color:var(--none);font-size:.88rem}
.accs{display:flex;flex-direction:column}
.acc{border-top:1px solid var(--fline)}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 2px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary h3{margin:0;flex:1;font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--salmon)}
.acc .meta{color:var(--sub);font-size:.8rem}
.acc .body{padding:0 2px 16px}
.sec-bar{display:flex;align-items:center;gap:10px}
.sec-bar .lab{flex:1;background:var(--card);border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-bar .lab svg{width:12px;height:14px;color:var(--teal-txt)}
.badge{background:var(--card);border-radius:999px;padding:5px 11px;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}

/* List */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;color:var(--text)}
.tile{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,var(--teal),var(--teal2));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tile svg{width:22px;height:22px}
.item .txt{flex:1;min-width:0}
.item b{display:block;font-size:1rem;font-weight:700}
.item small{display:block;color:var(--sub);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .go{color:var(--salmon);font-size:.7rem;font-weight:700;letter-spacing:.14em;margin-top:3px;display:block}
.score-chip{flex:none;font-weight:700;font-size:.8rem;padding:3px 9px;border-radius:999px;color:#fff}
.note{color:var(--ink);font-size:.85rem;text-align:center;padding:6px}
.empty{padding:22px 16px;color:var(--sub)}

/* Detail */
.topnav{display:flex;justify-content:space-between;align-items:center}
.back{border:none;background:none;color:var(--ink);font-weight:700;padding:8px 0;font-size:.95rem}
.detail{padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;gap:14px;align-items:center}
.dhead .tile{width:52px;height:52px;border-radius:14px}
.dhead h2{margin:0;font-size:1.45rem;line-height:1.15;font-weight:700}
.gen{color:var(--sub);font-style:italic;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chipbg);color:var(--teal-txt);border-radius:999px;padding:4px 11px;font-size:.75rem;font-weight:600}
.sec h3{margin:0 0 6px;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--salmon)}
.sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.sec li{position:relative;padding-left:18px}
.sec li::before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--teal-txt)}
.none{color:var(--none);font-size:.88rem}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}
.meter span{height:10px;border-radius:4px;background:var(--meter)}
.pscore{display:flex;align-items:baseline;gap:10px}
.pscore strong{font-size:1.7rem;font-weight:700}
.fine{color:var(--fine);font-size:.75rem;margin:0}

/* Forms */
.panel{padding:18px}
form{display:flex;flex-direction:column;gap:14px}
form label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.85rem}
form label span{font-weight:400;color:var(--sub);font-size:.75rem}
textarea{min-height:84px;resize:vertical}
form select{background-color:var(--field)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:999px;background:var(--coral);color:#fff;font-weight:700;padding:11px 20px;box-shadow:0 4px 14px rgba(201,71,47,.4)}
.btn2{border:1px solid var(--b2line);border-radius:999px;background:transparent;color:var(--text);font-weight:600;padding:10px 18px;font-size:.9rem}
.danger{color:var(--salmon)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--card2);color:var(--sky2);padding:10px 20px;border-radius:999px;font-weight:600;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* Motion */
@media (prefers-reduced-motion:no-preference){
  .view{animation:rise .25s ease-out}
}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="pill" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-40 12 12)"/><path d="M9.1 8.5l5.8 7" /></g></symbol>
    <symbol id="grp" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="1.8"><rect x="4" y="4.5" width="16" height="6" rx="3"/><rect x="4" y="13.5" width="16" height="6" rx="3"/><path d="M12 4.5v6M12 13.5v6"/></g></symbol>
    <symbol id="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="dna" viewBox="0 0 12 14"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 1c0 4 8 4 8 6s-8 2-8 6"/><path d="M10 1c0 4-8 4-8 6s8 2 8 6"/></g></symbol>
  </defs>
</svg>

<div class="wrap">
  <!-- Search -->
  <div id="listView" class="view">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="bar"><button class="pill" id="bkBtn" type="button">Backup</button><button class="pill" id="addBtn" type="button">+ Add</button><button class="pill cap" id="setBtn" type="button" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="2.5" y="8" width="19" height="8" rx="4" fill="#f3f5f7"/><path d="M12 8h5.5a4 4 0 0 1 0 8H12z" fill="#c95a50"/><rect x="2.5" y="8" width="19" height="8" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/><path d="M5 10.2h5" stroke="#fff" stroke-opacity=".7" stroke-width="1" stroke-linecap="round"/></g></svg></button></div>
      <div class="card panel" id="settings" hidden>
        <div style="display:flex;flex-direction:column;gap:10px">
          <b>Appearance</b>
          <div class="seg" role="group" aria-label="Appearance"><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button></div>
        </div>
      </div>
      <div class="top-art" id="topArt">
        <div class="brand">
          <div class="logo">MEDIFIND</div>
        </div>
        <div class="figure" id="figure" aria-hidden="true">
          <canvas id="torso"></canvas>
        </div>
      </div>

      <div class="card hero">
        <h1>Find a medicine</h1>
        <p id="sub">Search by brand or generic name</p>
        <input id="q" type="search" placeholder="e.g. Topamax or topiramate" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search medicines">
      </div>


      <div class="card panel" id="bk" hidden>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div><b>Backup your edits</b><div class="fine" id="bkInfo"></div></div>
          <div class="actions"><button class="btn" id="exp" type="button">Export backup</button><label class="btn2" for="imp">Import backup</label><input id="imp" type="file" accept=".json,application/json" hidden></div>
          <p class="fine">Edits are saved on this phone. Export a backup now and then and keep it in Files or iCloud Drive.</p>
        </div>
      </div>

      <div class="sec-bar"><div class="lab"><svg><use href="#dna"/></svg><span id="secLab">Therapeutic classes</span></div><span class="badge" id="count">0</span></div>
      <div class="groups" id="groups"></div>
      <div class="list" id="list" hidden></div>
    </div>
  </div>

  <!-- Detail -->
  <div id="cardView" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="topnav"><button class="back" id="back" type="button">‹ Back</button><button class="pill" id="editBtn" type="button">Edit</button></div>
      <div id="card"></div>
    </div>
  </div>

  <!-- Edit -->
  <div id="editView" class="view" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="topnav"><button class="back" id="cancel" type="button">‹ Cancel</button></div>
      <div class="card panel">
        <form id="form">
          <label>Generic name<input id="f-gen" required></label>
          <label>Brand names<span>One per line</span><textarea id="f-brands"></textarea></label>
          <label>Category<select id="f-cat"></select></label>
          <label>Common uses<span>One bullet per line</span><textarea id="f-uses"></textarea></label>
          <label>Off-label uses<span>One bullet per line</span><textarea id="f-off"></textarea></label>
          <label>Common side effects<span>One bullet per line</span><textarea id="f-sides"></textarea></label>
          <label>Pregnancy score<span>1 = safest, 10 = most dangerous</span><select id="f-preg"></select></label>
          <label>Pregnancy note<textarea id="f-pnote" style="min-height:60px"></textarea></label>
          <label>My notes<textarea id="f-notes" style="min-height:60px"></textarea></label>
          <div class="actions"><button class="btn" type="submit">Save</button><button class="btn2 danger" id="reset" type="button" hidden></button></div>
          <p class="fine" id="saveNote"></p>
        </form>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

      <button class="grp-head${counts[i] ? "" : " zero"}" type="button" aria-expanded="${open}"><span class="tile"><svg><use href="#grp"/></svg></span>
        <span class="txt"><b>${esc(name)}</b><small>${esc(desc)}</small></span><span class="badge">${counts[i]}</span>${chev}</button>
      <div class="grp-body"${open ? "" : " hidden"}>${open ? groupBody(i) : ""}</div></div>`;
  }).join("");
}
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  $("groups").hidden = !!q; $("list").hidden = !q;
  if (!q) { $("secLab").textContent = "Therapeutic classes"; $("count").textContent = CATS.length; renderGroups(); return; }
  const res = [];
  for (const m of ALL) {
    const names = [m.generic, ...m.brands.map(b => b.toLowerCase())];
    let score = names.some(n => n === q) ? 3 : names.some(n => n.startsWith(q)) ? 2 : names.some(n => n.includes(q)) ? 1 : 0;
    if (score) res.push([score, m]);
  }
  res.sort((a, b) => b[0] - a[0] || displayName(a[1], q).localeCompare(displayName(b[1], q)));
  $("count").textContent = res.length.toLocaleString();
  $("secLab").textContent = "Results";
  const shown = res.slice(0, 60);
  $("list").innerHTML = shown.length ? shown.map(([, m]) => {
    const n = displayName(m, q), others = m.brands.filter(b => b !== n);
    return `<button class="card item" type="button" data-id="${esc(m.id)}" data-name="${esc(n)}">${tile}
      <span class="txt"><b>${esc(n)}</b><small>${esc(m.brands.length ? m.generic : (m.cls || (CATS[m.cats[0]] || [""])[0]))}${others.length ? " · " + esc(others.join(", ")) : ""}</small><span class="go">VIEW ›</span></span>
      ${m.preg ? `<span class="score-chip" style="background:${pregColor(m.preg)}" title="Pregnancy score">${m.preg}/10</span>` : ""}</button>`;
  }).join("") + (res.length > 60 ? `<div class="note">Showing 60. Keep typing to narrow it down.</div>` : "")
    : `<div class="card empty">No matches. Try another spelling, or tap + Add to create it.</div>`;
}
$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) openCard(b.dataset.id, b.dataset.name); });
$("groups").addEventListener("click", e => {
  const r = e.target.closest(".mrow"); if (r) return openCard(r.dataset.id, "");
  const h = e.target.closest(".grp-head"); if (!h) return;
  const g = h.parentElement, i = +g.dataset.i, body = g.querySelector(".grp-body"), open = !openGroups.has(i);
  open ? openGroups.add(i) : openGroups.delete(i);
  h.setAttribute("aria-expanded", open); body.hidden = !open; body.innerHTML = open ? groupBody(i) : "";
});
$("q").addEventListener("input", renderList);
CATS.forEach(([n], i) => $("f-cat").add(new Option(n, i)));
$("f-preg").add(new Option("Not set", ""));
for (let i = 1; i <= 10; i++) $("f-preg").add(new Option(i + (i === 1 ? " (safest)" : i === 10 ? " (most dangerous)" : ""), i));

// ---------- Views ----------
let current = null, curName = null, scrollY = 0;
function show(v) { ["listView", "cardView", "editView"].forEach(x => $(x).hidden = x !== v); }
const bullets = (title, arr) => `<div class="sec"><h3>${title}</h3>${arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="none">Not filled in yet</div>`}</div>`;
function openCard(id, name) {
  const m = med(id); if (!m) return;
  if (!$("listView").hidden) scrollY = window.scrollY;
  if (id !== current) curName = null;
  if (name !== undefined) curName = name || null;
  current = id;
  const byGeneric = !(curName && m.brands.includes(curName)), title = byGeneric ? cap(m.generic) : curName;
  const subtitle = byGeneric ? (m.brands.length ? m.brands.slice(0, 3).join(", ") + (m.brands.length > 3 ? "…" : "") : "Generic only") : m.generic;
  const acc = (title, meta, body) => `<details class="acc"><summary><h3>${title}</h3><span class="meta">${meta}</span>${chev}</summary><div class="body">${body}</div></details>`;
  const list = arr => arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="none">Not filled in yet</div>`;
  const cnt = arr => arr.length ? arr.length : "Empty";
  $("card").innerHTML = `<div class="card detail">
    <div class="dhead">${tile}<div><h2>${esc(title)}</h2><div class="gen">${esc(subtitle)}</div></div></div>
    <div class="accs sec">
      ${acc("Brand names", cnt(m.brands), m.brands.length ? list(m.brands) : `<div class="none">Sold as a generic only</div>`)}
      ${acc("Generic name", "", `<div>${esc(cap(m.generic))}</div>${m.cls ? `<div class="none" style="margin-top:4px">Drug class: ${esc(m.cls)}</div>` : ""}`)}
      ${acc("Therapeutic class", cnt(m.cats), `<div class="chips">${m.cats.map(c => `<span class="chip">${esc((CATS[c] || ["Other"])[0])}</span>`).join("")}</div>`)}
      ${acc("Used for", cnt(m.uses), list(m.uses))}
      ${acc("Off-label uses", cnt(m.off), list(m.off))}
      ${acc("Common side effects", cnt(m.sides), list(m.sides))}
      ${acc("Pregnancy", m.preg ? `<span class="score-chip" style="background:${pregColor(m.preg)}">${m.preg}/10</span>` : "Not scored", m.preg ? `
        <div class="pscore"><strong style="color:${pregColor(m.preg)}">${m.preg}/10</strong><span>${pregWord(m.preg)}</span></div>
        <div class="meter">${Array.from({ length: 10 }, (_, k) => `<span style="${k < m.preg ? "background:" + pregColor(m.preg) : ""}"></span>`).join("")}</div>
        ${m.pnote ? `<div>${esc(m.pnote)}</div>` : ""}` : `<div class="none">Not scored yet</div>`)}
      ${m.notes ? acc("My notes", "", `<div>${esc(m.notes).replace(/\n/g, "<br>")}</div>`) : ""}
    </div>
    <p class="fine">Personal reference only. Pregnancy scores are your own 1–10 scale, not an official FDA rating.</p>
  </div>`;
  show("cardView"); window.scrollTo(0, 0);
}
$("back").onclick = () => { current = null; show("listView"); renderList(); window.scrollTo(0, scrollY); };

// ---------- Edit ----------
let editing = null;
const lines = s => s.split("\n").map(x => x.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
function openEdit(id) {
  const m = id ? med(id) : { generic: "", brands: [], cats: [MISC], uses: [], off: [], sides: [], preg: null, pnote: "", notes: "", custom: true };
  editing = id;
  $("f-gen").value = m.generic; $("f-gen").readOnly = !!id && !m.custom;
  $("f-brands").value = m.brands.join("\n");
  $("f-cat").value = m.cats[0] ?? 0;
  $("f-uses").value = m.uses.join("\n"); $("f-off").value = m.off.join("\n"); $("f-sides").value = m.sides.join("\n");
  $("f-preg").value = m.preg || ""; $("f-pnote").value = m.pnote; $("f-notes").value = m.notes;
  const r = $("reset");
  r.hidden = !(id && (m.custom || m.edited));
  r.textContent = m.custom ? "Delete medicine" : "Undo my changes";
  r.dataset.confirm = "";
  $("saveNote").textContent = "";
  show("editView"); window.scrollTo(0, 0);
}
$("editBtn").onclick = () => openEdit(current);
$("addBtn").onclick = () => { scrollY = window.scrollY; openEdit(null); };
$("cancel").onclick = () => editing ? openCard(editing) : (show("listView"), window.scrollTo(0, scrollY));
$("form").addEventListener("submit", ev => {
  ev.preventDefault();
  const gen = $("f-gen").value.trim().toLowerCase();
  if (!gen) return;
  let id = editing;
  const base = id && byId.get(id);
  if (!id) { id = slug(gen); if (byId.has(id) || edits[id]) id = id.slice(0, 80) + "-" + Date.now().toString(36); }
  const cat = +$("f-cat").value;
  edits[id] = {
    generic: base ? base.generic : gen,
    brands: lines($("f-brands").value),
    cats: base && cat === base.cats[0] ? base.cats : [cat], catv: 2,
    uses: lines($("f-uses").value), off: lines($("f-off").value), sides: lines($("f-sides").value),
    preg: $("f-preg").value ? +$("f-preg").value : null,
    pnote: $("f-pnote").value.trim(), notes: $("f-notes").value.trim()
  };
  try { saveEdits(); } catch (e) { $("saveNote").textContent = "Couldn't save. Your phone may be out of storage."; return; }
  ALL = allMeds(); toast("Saved"); openCard(id);
});
$("reset").onclick = () => {
  const r = $("reset");
  if (!r.dataset.confirm) { r.dataset.confirm = "1"; r.textContent = "Tap again to confirm"; return; }
  const custom = !byId.has(editing);
  delete edits[editing];
  try { saveEdits(); } catch (e) {}
  ALL = allMeds();
  toast(custom ? "Deleted" : "Changes undone");
  if (custom) { editing = null; current = null; show("listView"); renderList(); } else openCard(editing);
};
let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

// ---------- Settings: light / dark ----------
function setMode(m) {
  if (m === "dark") document.documentElement.dataset.mode = "dark"; else delete document.documentElement.dataset.mode;
  try { localStorage.setItem("medifind-mode", m); } catch (e) {}
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  document.querySelector('meta[name="theme-color"]').content = m === "dark" ? "#0c2547" : "#e9f0f7";
  dispatchEvent(new Event("modechange"));
}
setMode(document.documentElement.dataset.mode === "dark" ? "dark" : "light");
$("setBtn").onclick = () => {
  const b = $("setBtn"); b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
  const open = $("settings").hidden; $("settings").hidden = !open; b.setAttribute("aria-expanded", open);
  if (open) $("bk").hidden = true;
};
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

// ---------- Backup ----------
function bkInfo() { const n = Object.keys(edits).length; $("bkInfo").textContent = n ? n + (n === 1 ? " medicine edited or added" : " medicines edited or added") : "No edits yet"; }
$("bkBtn").onclick = () => { $("bk").hidden = !$("bk").hidden; $("settings").hidden = true; bkInfo(); };
$("exp").onclick = async () => {
  const name = "medifind-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const file = new File([JSON.stringify(edits, null, 1)], name, { type: "application/json" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
};
$("imp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data !== "object" || Array.isArray(data)) throw 0;
    const n = Object.keys(data).length;
    Object.assign(edits, data); saveEdits(); ALL = allMeds(); renderList(); bkInfo();
    toast("Imported " + n + (n === 1 ? " medicine" : " medicines"));
  } catch (err) { toast("That file isn't a Medifind backup"); }
};

// ---------- Background: drifting dots, faint hexagons, turning DNA ----------
(() => {
  const cv = $("bg"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, dpr, dots = [];
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 1.8, vx: (Math.random() - .5) * .12, vy: -.05 - Math.random() * .12, a: .25 + Math.random() * .4 }));
  }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    // dots
    for (const d of dots) {
      if (!still) { d.x += d.vx; d.y += d.vy; if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; } if (d.x < -5) d.x = W + 5; if (d.x > W + 5) d.x = -5; }
      ctx.fillStyle = document.documentElement.dataset.mode === "dark" ? `rgba(150,195,240,${d.a * .8})` : `rgba(80,95,110,${d.a})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    }
    // DNA helix on the right edge
    const cx = W - 22, amp = 13, ph = still ? 0 : t / 900, top = 170, len = Math.min(330, H - 220);
    for (let y = 0; y <= len; y += 11) {
      const a = y / 26 + ph, x1 = cx + Math.sin(a) * amp, x2 = cx - Math.sin(a) * amp, z = Math.cos(a);
      ctx.strokeStyle = `rgba(255,255,255,${.25 + .2 * Math.abs(z)})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x1, top + y); ctx.lineTo(x2, top + y); ctx.stroke();
      ctx.fillStyle = z > 0 ? "rgba(255,255,255,.9)" : "rgba(150,190,230,.8)";
      ctx.beginPath(); ctx.arc(x1, top + y, 2.2, 0, 7); ctx.fill();
      ctx.fillStyle = z > 0 ? "rgba(150,190,230,.8)" : "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(x2, top + y, 2.2, 0, 7); ctx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }
  size(); addEventListener("resize", size); addEventListener("modechange", () => { if (still) frame(0); }); requestAnimationFrame(frame);
})();

// ---------- Wireframe torso, beating heart and heartbeat line ----------
(() => {
  const fig = $("figure"), cv = $("torso"), ctx = cv.getContext("2d");
  let dark = false;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const heartImg = new Image(); heartImg.src = "heart.png";   // 7 frames, 180 x 274 each
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // Body shape in a 300 x 250 box: outer contour (left side, mirrored) plus arm and torso-side lines
  const outer = [[124,0],[123,22],[112,36],[88,46],[62,54],[44,66],[34,86],[30,112],[28,150],[26,195],[24,250]];
  const armIn = [[56,104],[56,150],[55,200],[54,250]];
  const side  = [[74,106],[78,150],[81,200],[83,250]];
  const neckline = [[123,22],[134,32],[150,36],[166,32],[177,22]];
  const mir = l => l.map(([x, y]) => [300 - x, y]);
  const P = [], E = [], seen = new Set();
  const link = (a, b) => { const k = a < b ? a + "-" + b : b + "-" + a; if (a !== b && !seen.has(k)) { seen.add(k); E.push([a, b]); } };
  function contour(line, step, jit) {          // points along a line, joined in order
    let prev = -1;
    for (let i = 0; i < line.length - 1; i++) {
      const [x1, y1] = line[i], [x2, y2] = line[i + 1], n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step));
      for (let k = 0; k < n; k++) { const t = k / n; P.push([x1 + (x2 - x1) * t + (rnd() - .5) * jit, y1 + (y2 - y1) * t + (rnd() - .5) * jit]); if (prev >= 0) link(prev, P.length - 1); prev = P.length - 1; }
    }
    P.push(line[line.length - 1].slice()); link(prev, P.length - 1);
  }
  [outer, mir(outer)].forEach(l => contour(l, 9, 3));
  [armIn, mir(armIn), side, mir(side)].forEach(l => contour(l, 12, 5));
  contour(neckline, 8, 2);
  // inner points: the shoulders and arms are dense, the chest is sparse so the heart stands out
  const region = (x, y) => {
    const xl = Math.min(x, 300 - x);
    const ox = y < 22 ? 124 : y < 46 ? 124 - (y - 22) * 1.5 : y < 66 ? 88 - (y - 46) * 2.2 : y < 112 ? 44 - (y - 66) * .3 : 30 - (y - 112) * .04;
    if (xl < ox) return 0;
    if (y > 104 && xl > 56 && xl < 74) return 0;          // gap between arm and body
    return xl < 74 && y > 104 ? 2 : (y < 70 ? 2 : 1);
  };
  for (let tries = 0; P.length < 260 && tries < 6000; tries++) {
    const x = 24 + rnd() * 252, y = 2 + rnd() * 246, r = region(x, y);
    if (!r) continue;
    const xl = Math.min(x, 300 - x), chest = xl > 95 && y > 70;
    if (r === 2 || (!chest && rnd() < .7) || rnd() < .16) P.push([x, y]);
  }
  P.forEach((p, i) => P.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1]), j]).filter(([d, j]) => j !== i && d < 30).sort((a, b) => a[0] - b[0]).slice(0, 3).forEach(([, j]) => link(i, j)));
  const T = [];
  E.forEach(([a, b]) => { for (const [c, d] of E) { const o = c === a ? d : d === a ? c : -1; if (o >= 0 && o !== b && seen.has(b < o ? b + "-" + o : o + "-" + b) && rnd() < .35) T.push([a, b, o]); } });
  const ph = P.map(() => rnd() * 6.28);
  const CD = { tri: "rgba(70,150,255,.08)", line: "rgba(90,190,255,.5)", dot: "#eaf8ff", glow: "rgba(80,190,255,.9)", ecg: "rgba(255,70,80,.55)", hot: "#ff4d5a" }, CL = { tri: "rgba(40,130,180,.07)", line: "rgba(30,115,160,.38)", dot: "#1f86b3", glow: "rgba(31,134,179,.5)", ecg: "rgba(201,71,47,.4)", hot: "#d23b2b" };
  let C = CL;
  const spike = [[0,0],[8,-5],[13,0],[19,0],[23,6],[29,-34],[36,28],[41,-9],[47,0],[56,-7],[63,0]];
  let W, H, s, ox, oy, dpr;
  function layout() {
    W = fig.clientWidth; s = Math.min(W * .96, 360) / 300; ox = (W - 300 * s) / 2; oy = 4;
    H = Math.round(oy + 232 * s); fig.style.height = H + "px";
    dpr = Math.min(devicePixelRatio || 1, 2); cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (still) draw(0);
  }
  function ecgPath(yE) {
    ctx.beginPath(); ctx.moveTo(0, yE);
    const k = s * .85;
    for (const x0 of [W * .04, W * .81]) for (const [dx, dy] of spike) ctx.lineTo(x0 + dx * k, yE + dy * k);
    ctx.lineTo(W, yE);
  }
  function draw(t) {
    dark = document.documentElement.dataset.mode === "dark"; C = dark ? CD : CL;
    ctx.clearRect(0, 0, W, H);
    const X = P.map(([x, y], i) => [ox + (x + Math.sin(t / 1400 + ph[i]) * 1.2) * s, oy + (y + Math.cos(t / 1700 + ph[i]) * 1.2) * s]);
    ctx.fillStyle = C.tri;
    for (const [a, b, c] of T) { ctx.beginPath(); ctx.moveTo(...X[a]); ctx.lineTo(...X[b]); ctx.lineTo(...X[c]); ctx.fill(); }
    ctx.strokeStyle = C.line; ctx.lineWidth = .8; ctx.beginPath();
    for (const [a, b] of E) { ctx.moveTo(...X[a]); ctx.lineTo(...X[b]); }
    ctx.stroke();
    ctx.shadowColor = C.glow; ctx.shadowBlur = dark ? 6 : 3; ctx.fillStyle = C.dot;
    X.forEach(([x, y], i) => { ctx.globalAlpha = .5 + .5 * Math.sin(t / 650 + ph[i] * 3) ** 2; ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    // heart: glow pulse, then the current frame of the beat (0.7 s per beat, 7 frames)
    const beat = (t % 700) / 700, fi = Math.floor(beat * 7);
    const hw = 58 * s, hh = hw * 274 / 180, hx = ox + 158 * s - hw / 2, hy = oy + 112 * s - hh / 2;
    const pulse = beat < .3 ? beat / .3 : 1 - (beat - .3) / .7;
    const gr = hw * (1.1 + .25 * pulse), gx = hx + hw / 2, gy = hy + hh * .55;
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, `rgba(240,50,60,${.35 + .3 * pulse})`); g.addColorStop(1, "rgba(240,50,60,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 7); ctx.fill();
    if (heartImg.complete && heartImg.naturalWidth) {
      ctx.shadowColor = "rgba(255,40,40,.7)"; ctx.shadowBlur = 10 + 8 * pulse;
      ctx.drawImage(heartImg, fi * 180, 0, 180, 274, hx, hy, hw, hh); ctx.shadowBlur = 0;
    }
    // heartbeat line through the chest
    const yE = oy + 124 * s;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.setLineDash(dark ? [3, 3] : []); ctx.strokeStyle = C.ecg; ctx.lineWidth = 1.5; ecgPath(yE); ctx.stroke(); ctx.setLineDash([]);
    if (t) {
      const head = ((t % 2400) / 2400) * (W + 120) - 60;
      ctx.save(); ctx.beginPath(); ctx.rect(head - 90, 0, 90, H); ctx.clip();
      const lg = ctx.createLinearGradient(head - 90, 0, head, 0); lg.addColorStop(0, "rgba(255,80,80,0)"); lg.addColorStop(1, C.hot);
      ctx.strokeStyle = lg; ctx.lineWidth = 2.2; ctx.shadowColor = C.hot; ctx.shadowBlur = 8; ecgPath(yE); ctx.stroke(); ctx.restore();
    }
  }
  function loop(t) { draw(t); requestAnimationFrame(loop); }
  layout(); addEventListener("resize", layout); addEventListener("modechange", () => { if (still) draw(0); });
  if (still) heartImg.onload = () => draw(0); else requestAnimationFrame(loop);
})();

renderList();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
