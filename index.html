<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Med Guide">
<meta name="theme-color" content="#f4f7f6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pocket Med Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow reading column; sticky search bar; list → card → edit form views. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --fg:#14211e; --muted:#5d6f6a; --line:#dde6e3; --accent:#0e6b58; --accent-soft:#e1f0ec;
  --low:#2f9e5c; --mid:#e0a422; --high:#e0662a; --top:#c72f3b;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18211f; --fg:#e8f0ee; --muted:#93a6a0; --line:#2a3633; --accent:#5ccfb2; --accent-soft:#1d322d; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514; --surface:#18211f; --fg:#e8f0ee; --muted:#93a6a0; --line:#2a3633; --accent:#5ccfb2; --accent-soft:#1d322d; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-size:1.45rem;margin:0;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box}
#q{font-size:17px}
select{width:auto;flex:1;min-width:0;padding:10px 12px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{border:none;border-radius:12px;background:var(--accent);color:var(--surface);font-weight:700;padding:12px 16px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:8px 0}
.count{color:var(--muted);font-size:.85rem}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--fg);width:100%}
.item:last-child{border-bottom:none}
.item b{display:block;font-size:1.02rem}
.item small{color:var(--muted);font-size:.88rem}
.item .txt{min-width:0}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.more{padding:12px 14px;color:var(--muted);font-size:.88rem}
.empty{padding:24px 14px;color:var(--muted)}

/* Card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.15;text-wrap:balance}
.gen{color:var(--muted);font-style:italic;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700}
.sec h3{margin:0 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sec ul{margin:0;padding-left:1.2em}
.sec li{margin:2px 0}
.none{color:var(--muted);font-size:.92rem}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:6px 0}
.meter span{height:12px;border-radius:3px;background:var(--line)}
.score{display:flex;align-items:baseline;gap:8px}
.score strong{font-family:var(--display);font-size:1.6rem}
.fine{color:var(--muted);font-size:.8rem;margin:0}

/* Form */
form{display:flex;flex-direction:column;gap:14px}
form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
form label span{font-weight:400;color:var(--muted);font-size:.8rem}
textarea{min-height:84px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.danger{color:var(--top)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:no-preference){.card,.list{animation:in .15s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}}}
</style>
</head>
<body>

<div class="wrap">
  <div id="listView">
    <div class="top">
      <div class="row" style="justify-content:space-between"><h1>Pocket Med Guide</h1><div class="row"><button class="ghost" id="bkBtn" type="button">Backup</button><button class="ghost" id="addBtn" type="button">+ Add</button></div></div>
      <div class="card" id="bk" hidden><div><b>Backup your edits</b><div class="fine" id="bkInfo"></div></div><div class="actions"><button class="btn" id="exp" type="button">Export backup</button><label class="ghost" for="imp" style="display:inline-block">Import backup</label><input id="imp" type="file" accept=".json,application/json" hidden></div><p class="fine">Edits are saved on this phone. Export a backup now and then, and keep it in Files or iCloud Drive.</p></div>
      <input id="q" type="search" placeholder="Search brand or generic name" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row">
        <select id="cat" aria-label="Category"><option value="">All categories</option></select>
        <select id="filled" aria-label="Show"><option value="">All medicines</option><option value="1">Filled in only</option></select>
      </div>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div id="cardView" hidden>
    <div class="top"><div class="row" style="justify-content:space-between"><button class="link" id="back" type="button">‹ Back</button><button class="ghost" id="editBtn" type="button">Edit</button></div></div>
    <div id="card"></div>
  </div>

  <div id="editView" hidden>
    <div class="top"><div class="row"><button class="link" id="cancel" type="button">‹ Cancel</button></div></div>
    <div class="card">
      <form id="form">
        <label>Generic name<input id="f-gen" required></label>
        <label>Brand names<span>One per line</span><textarea id="f-brands"></textarea></label>
        <label>Category<select id="f-cat"></select></label>
        <label>Common uses<span>One bullet per line</span><textarea id="f-uses"></textarea></label>
        <label>Off-label uses<span>One bullet per line</span><textarea id="f-off"></textarea></label>
        <label>Common side effects<span>One bullet per line</span><textarea id="f-sides"></textarea></label>
        <label>Pregnancy score<span>1 = safest, 10 = most dangerous</span><select id="f-preg"></select></label>
        <label>Pregnancy note<textarea id="f-pnote" style="min-height:60px"></textarea></label>
        <label>My notes<textarea id="f-notes" style="min-height:60px"></textarea></label>
        <div class="actions"><button class="btn" type="submit">Save</button><button class="ghost danger" id="reset" type="button" hidden></button></div>
        <p class="fine" id="saveNote"></p>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

"],["ziprasidone mesylate","Geodon",[1],""],["ziv-aflibercept","Zaltrap",[18],"Vascular Endothelial Growth Factor Inhibitor"],["zolbetuximab-clzb","Vyloy",[15],"Claudin 18.2-directed Cytolytic Antibody"],["zoledronic acid","Reclast|Zoledronic|Zometa",[6,17],""],["zoliflodacin","Nuzolvence",[10],""],["zolmitriptan","Zomig",[8],"Serotonin-1b and Serotonin-1d Receptor Agonist"],["zolpidem tartrate","Ambien|Ambien CR|Edluar",[26],""],["zongertinib","Hernexeos",[18],"Kinase Inhibitor"],["zonisamide","Zonegran|Zonisade",[8],"Anti-epileptic Agent"],["zopapogene imadenovec-drba","Papzimeos",[26],""],["zoster vaccine recombinant, adjuvanted","Shingrix",[20],""],["zuranolone","Zurzuvae",[26],"Neuroactive Steroid Gamma-Aminobutyric Acid A Receptor Positive Modulator"]]};
// Details written for the starter entries. Your edits are saved on top of these.
const DETAILS = {
  "topiramate": {
    uses: ["Seizures (anticonvulsant)", "Migraine prevention"],
    off: ["Weight loss (most common)", "Craving reduction in addiction", "Bipolar disorder (mood stabilizing)", "Binge eating disorder"],
    sides: ["Brain fog / slowed thinking", "Memory problems", "Tingling in hands and feet", "Taste changes (fizzy drinks taste flat)"],
    preg: 8,
    pnote: "Linked to cleft lip and palate. Can make hormonal birth control less effective."
  }
};
const CATS = DATA.cats;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 90) || "med";
const BASE = DATA.rows.map(([g, b, c, k]) => ({ id: slug(g), generic: g, brands: b ? b.split("|") : [], cats: c, cls: k }));
const byId = new Map(BASE.map(m => [m.id, m]));
let edits = {};            // id -> saved doc from the database
const KEY = "pmg-edits";
let db = true;
const saveEdits = () => localStorage.setItem(KEY, JSON.stringify(edits));
const medsCol = { doc: id => ({ set: async d => { edits[id] = d; saveEdits(); }, delete: async () => { delete edits[id]; saveEdits(); } }) };
try { edits = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { edits = {}; }
const $ = id => document.getElementById(id);

function med(id) {
  const base = byId.get(id), e = edits[id];
  if (!base && !e) return null;
  const d = DETAILS[base ? base.generic : ""] || {};
  const m = { id, generic: "", brands: [], cats: [], cls: "", uses: [], off: [], sides: [], preg: null, pnote: "", notes: "", ...base, ...d, ...(e || {}) };
  m.edited = !!e; m.custom = !base;
  return m;
}
function allMeds() {
  const ids = new Set([...BASE.map(m => m.id), ...Object.keys(edits)]);
  return [...ids].map(med).filter(Boolean);
}
const filledIn = m => m.uses.length || m.off.length || m.sides.length || m.preg;
const pregColor = n => !n ? "var(--line)" : n <= 3 ? "var(--low)" : n <= 6 ? "var(--mid)" : n <= 8 ? "var(--high)" : "var(--top)";
const pregWord = n => n <= 3 ? "Lower risk" : n <= 6 ? "Moderate risk" : n <= 8 ? "High risk" : "Avoid";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => s.replace(/(^|[\s;(/-])([a-z])/g, (a, p, c) => p + c.toUpperCase());
const displayName = (m, q) => (q && (m.brands.find(b => b.toLowerCase().startsWith(q)) || m.brands.find(b => b.toLowerCase().includes(q)))) || m.brands[0] || cap(m.generic);

// ---------- List ----------
let ALL = allMeds();
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const c = $("cat").value, f = $("filled").value;
  let res = [];
  for (const m of ALL) {
    if (c !== "" && !m.cats.includes(+c)) continue;
    if (f && !filledIn(m)) continue;
    let score = 0;
    if (q) {
      const names = [m.generic, ...m.brands.map(b => b.toLowerCase())];
      if (names.some(n => n === q)) score = 3;
      else if (names.some(n => n.startsWith(q))) score = 2;
      else if (names.some(n => n.includes(q))) score = 1;
      else continue;
    }
    res.push([score, m]);
  }
  res.sort((a, b) => b[0] - a[0] || displayName(a[1], q).localeCompare(displayName(b[1], q)));
  const shown = res.slice(0, 60);
  $("count").textContent = res.length.toLocaleString() + (res.length === 1 ? " medicine" : " medicines");
  $("list").innerHTML = shown.length ? shown.map(([, m]) => { const n = displayName(m, q), others = m.brands.filter(b => b !== n); return `
    <button class="item" type="button" data-id="${esc(m.id)}" data-name="${esc(n)}">
      <span class="txt"><b>${esc(n)}</b><small>${esc(m.brands.length ? m.generic : (m.cls || CATS[m.cats[0]] || ""))}${others.length ? " · " + esc(others.join(", ")) : ""}</small></span>
      ${m.preg ? `<span class="dot" style="background:${pregColor(m.preg)}" title="Pregnancy ${m.preg}/10"></span>` : ""}
    </button>`; }).join("") + (res.length > 60 ? `<div class="more">Showing 60. Keep typing to narrow it down.</div>` : "")
    : `<div class="empty">No matches. Try another spelling, or tap + Add to create it.</div>`;
}
$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) openCard(b.dataset.id, b.dataset.name); });
["q", "cat", "filled"].forEach(id => $(id).addEventListener("input", renderList));
CATS.forEach((c, i) => { $("cat").add(new Option(c, i)); $("f-cat").add(new Option(c, i)); });
$("f-preg").add(new Option("Not set", ""));
for (let i = 1; i <= 10; i++) $("f-preg").add(new Option(i + (i === 1 ? " (safest)" : i === 10 ? " (most dangerous)" : ""), i));

// ---------- Views ----------
let current = null, curName = null, scrollY = 0;
function show(v) { ["listView", "cardView", "editView"].forEach(x => $(x).hidden = x !== v); }
function bullets(title, arr) {
  return `<div class="sec"><h3>${title}</h3>${arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div class="none">Not filled in yet</div>`}</div>`;
}
function openCard(id, name) {
  const m = med(id); if (!m) return;
  if (id !== current) curName = null;
  if (name) curName = name;
  const title = curName && m.brands.includes(curName) ? curName : displayName(m);
  if (!$("listView").hidden) scrollY = window.scrollY;
  current = id;
  $("card").innerHTML = `<div class="card">
    <div><h2>${esc(title)}</h2><div class="gen">${esc(m.generic)}</div></div>
    <div class="chips">${m.cats.map(c => `<span class="chip">${esc(CATS[c])}</span>`).join("")}${m.cls ? `<span class="chip">${esc(m.cls)}</span>` : ""}</div>
    ${m.brands.length > 1 ? bullets("Brand names", m.brands) : ""}
    ${bullets("Used for", m.uses)}
    ${bullets("Off-label uses", m.off)}
    ${bullets("Common side effects", m.sides)}
    <div class="sec"><h3>Pregnancy</h3>${m.preg ? `
      <div class="score"><strong style="color:${pregColor(m.preg)}">${m.preg}/10</strong><span>${pregWord(m.preg)}</span></div>
      <div class="meter">${Array.from({ length: 10 }, (_, i) => `<span style="${i < m.preg ? "background:" + pregColor(m.preg) : ""}"></span>`).join("")}</div>
      ${m.pnote ? `<div>${esc(m.pnote)}</div>` : ""}` : `<div class="none">Not scored yet</div>`}</div>
    ${m.notes ? `<div class="sec"><h3>My notes</h3><div>${esc(m.notes).replace(/\n/g, "<br>")}</div></div>` : ""}
    <p class="fine">Personal reference only. Pregnancy scores are your own 1–10 scale, not an official FDA rating.</p>
  </div>`;
  $("editBtn").hidden = !db;
  show("cardView"); window.scrollTo(0, 0);
}
$("back").onclick = () => { current = null; show("listView"); renderList(); window.scrollTo(0, scrollY); };

// ---------- Edit ----------
let editing = null;
const lines = s => s.split("\n").map(x => x.replace(/^[-•*]\s*/, "").trim()).filter(Boolean);
function openEdit(id) {
  const m = id ? med(id) : { generic: "", brands: [], cats: [0], uses: [], off: [], sides: [], preg: null, pnote: "", notes: "", custom: true };
  editing = id;
  $("f-gen").value = m.generic; $("f-gen").readOnly = !!id && !m.custom;
  $("f-brands").value = m.brands.join("\n");
  $("f-cat").value = m.cats[0] ?? 0;
  $("f-uses").value = m.uses.join("\n"); $("f-off").value = m.off.join("\n"); $("f-sides").value = m.sides.join("\n");
  $("f-preg").value = m.preg || ""; $("f-pnote").value = m.pnote; $("f-notes").value = m.notes;
  const r = $("reset");
  r.hidden = !(id && (m.custom || m.edited));
  r.textContent = m.custom ? "Delete medicine" : "Undo my changes";
  r.dataset.confirm = "";
  $("saveNote").textContent = "";
  show("editView"); window.scrollTo(0, 0);
}
$("editBtn").onclick = () => openEdit(current);
$("addBtn").onclick = () => { if (!db) return toast("Saving isn't available in this view"); scrollY = window.scrollY; openEdit(null); };
$("cancel").onclick = () => editing ? openCard(editing) : (show("listView"), window.scrollTo(0, scrollY));

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const gen = $("f-gen").value.trim().toLowerCase();
  if (!gen) return;
  let id = editing;
  const base = id && byId.get(id);
  if (!id) { id = slug(gen); if (byId.has(id) || edits[id]) id = id.slice(0, 80) + "-" + Date.now().toString(36); }
  const doc = {
    generic: base ? base.generic : gen,
    brands: lines($("f-brands").value),
    cats: base ? (+$("f-cat").value === base.cats[0] ? base.cats : [+$("f-cat").value]) : [+$("f-cat").value],
    uses: lines($("f-uses").value), off: lines($("f-off").value), sides: lines($("f-sides").value),
    preg: $("f-preg").value ? +$("f-preg").value : null,
    pnote: $("f-pnote").value.trim(), notes: $("f-notes").value.trim()
  };
  $("saveNote").textContent = "Saving…";
  try {
    await medsCol.doc(id).set(doc);
    edits[id] = doc; ALL = allMeds();
    toast("Saved"); openCard(id);
  } catch (e) { $("saveNote").textContent = "Couldn't save. Check your connection and try again."; }
});
$("reset").onclick = async () => {
  const r = $("reset");
  if (!r.dataset.confirm) { r.dataset.confirm = "1"; r.textContent = "Tap again to confirm"; return; }
  const custom = !byId.has(editing);
  try {
    await medsCol.doc(editing).delete();
    delete edits[editing]; ALL = allMeds();
    toast(custom ? "Deleted" : "Changes undone");
    if (custom) { editing = null; current = null; show("listView"); renderList(); } else openCard(editing);
  } catch (e) { $("saveNote").textContent = "Couldn't update. Check your connection and try again."; }
};

let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1800); }

// ---------- Backup ----------
function bkInfo() { const n = Object.keys(edits).length; $("bkInfo").textContent = n ? n + (n === 1 ? " medicine edited or added" : " medicines edited or added") : "No edits yet"; }
$("bkBtn").onclick = () => { $("bk").hidden = !$("bk").hidden; bkInfo(); };
$("exp").onclick = async () => {
  const name = "med-guide-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const file = new File([JSON.stringify(edits, null, 1)], name, { type: "application/json" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click();
};
$("imp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data !== "object" || Array.isArray(data)) throw 0;
    const n = Object.keys(data).length;
    Object.assign(edits, data); saveEdits(); ALL = allMeds(); renderList(); bkInfo();
    toast("Imported " + n + (n === 1 ? " medicine" : " medicines"));
  } catch (err) { toast("That file isn't a Med Guide backup"); }
};

renderList();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
