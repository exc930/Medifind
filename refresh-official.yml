name: Refresh official FDA info

on:
  schedule:
    - cron: "17 9 * * 1"     # every Monday morning
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask the FDA for the latest labels
        run: node tools/refresh-official.mjs
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      - name: Save the results
        run: |
          git config user.name "MediFind updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official.json
          git diff --cached --quiet || (git commit -m "Refresh official FDA info" && git push)
